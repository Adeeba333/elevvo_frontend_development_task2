<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact_Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <header><h1>Contact Me</h1></header>
        <p class="intro">Send me a message and I will get back to you within two days</p>
        <form action="#" method="post" aria-label="Contact Form">
            <p><i>Fields with asterisk(*) are required.</i></p>
            <fieldset>
                <legend>Contact Information</legend>

                <div class="field">
                    <label for="name">Full Name*:</label>
                    <input type="text" id="name" name="name" autocomplete="name">
                    <span class="error" id="nameError"></span>
                </div><br><br>

                <div class="field">
                    <label for="email">Email Address*:</label>
                    <input type="email" id="email" name="email" autocomplete="email">
                    <span class="error" id="emailError"></span>
                </div><br><br>

                <div class="field">
                    <label for="phone">Phone Number:</label>
                    <input type="tel" id="phone" name="phone" autocomplete="tel" 
                            inputmode="numeric" pattern="[0-9]{1,11}" minlength="1" maxlength="11" aria-describedby="phone-hint">
                            <br>
                    <small id="phone-hint"><i>Digits only, up to 11 digits. Example: 01712345678</i></small><br><br>
                    <span class="error" id="phoneError"></span>
                </div><br><br>
            </fieldset>
                    
            <fieldset>
                <legend>Your Message</legend>
                        
                <div class="field">
                    <label for="subject">Subject *</label><br>
                    <select id="subject" name="subject" required>
                        <option value="">Please choose a subject</option>
                        <option value="job">Job opportunity</option>
                        <option value="project">Project collaboration</option>
                        <option value="feedback">Feedback</option>
                        <option value="other">Other</option>
                    </select>
                    <span class="error" id="subjectError"></span>
                    <br><br>
                </div>

                <div class="field">
                    <label for="message">Message*</label>
                    <textarea id="message" name="message" rows="6" placeholder="Enter your message here....."></textarea>
                    <span class="error" id="messageError"></span>
                </div>
            </fieldset>

            <fieldset>
                <legend>Preferred Contact Method</legend>
                        
                <div>
                    <input type="radio" id="contact-email" name="contact-method" value="email" checked>
                    <label for="contact-email">Email</label>
                </div><br>
                        
                <div>
                    <input type="radio" id="contact-phone" name="contact-method" value="phone">
                    <label for="contact-phone">Phone</label>
                </div><br>
            </fieldset>

                <div class="field">
                    <input type="checkbox" id="consent" name="consent" required>
                    <label for="consent">I consent to the collection and use of my personal information.
                        I also agree to be contacted about this message.</label>
                </div>
                <span class="error" id="consentError"></span>

                <div>
                    <button type="submit">Send Message</button>
                    <button type="reset">Reset Form</button>
                </div>
                    <p class="success" id="successMsg" hidden>Thank you! Your message has been sent</p>
        </form>
    </main>
    <script src="script.js">THIS JAVASCRIPT IS RUNNIG</script>
</body>
</html>
